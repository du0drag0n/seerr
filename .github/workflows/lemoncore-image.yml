# Builds Jay's lemoncore Seerr image (upstream release + local patches) and
# publishes it to ghcr.io/du0drag0n/seerr. Deployed on nitrogen via the
# media-tools stack in du0drag0n/lemoncore-stacks.
name: Lemoncore image

on:
  push:
    branches: [lemoncore]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lemoncore-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'du0drag0n/seerr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=lemoncore
            type=raw,value=${{ steps.v.outputs.version }}-tmdb
            type=sha,prefix=lemoncore-

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
